name: Static site checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check HTML and JavaScript
        run: python scripts/check_site.py
      - name: Validate real-time scraper integration contract
        run: python scripts/validate_scraper_contract.py
      - name: Install browser test dependencies
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture screenshots and test cart checkout
        run: node scripts/capture_screenshots.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: nexovonarsa-superapp-screenshots
          path: artifacts/screenshots/
          if-no-files-found: error
          retention-days: 14
